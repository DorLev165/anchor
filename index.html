<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Anchor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#F4F5F0;
    --surface:#FFFFFF;
    --surface2:#E9EEE5;
    --ink:#22302A;
    --ink-soft:#5C6B62;
    --line:#D8DFD4;
    --accent:#2F6B54;
    --accent-soft:#DCE8E1;
    --accent-ink:#FFFFFF;
    --amber:#B97F2A;
    --amber-soft:#F4E7CD;
    --amber-ink:#4A3410;
    --bad:#A05252;
    --shadow:0 12px 32px rgba(34,48,42,.10);
    --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141B17;
      --surface:#1D2721;
      --surface2:#25322B;
      --ink:#E7EDE7;
      --ink-soft:#9DACA1;
      --line:#31413A;
      --accent:#7FB89D;
      --accent-soft:#25382F;
      --accent-ink:#0F1F18;
      --amber:#D9A44E;
      --amber-soft:#3A3020;
      --amber-ink:#F0DDB8;
      --bad:#C88585;
      --shadow:0 12px 32px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141B17;
    --surface:#1D2721;
    --surface2:#25322B;
    --ink:#E7EDE7;
    --ink-soft:#9DACA1;
    --line:#31413A;
    --accent:#7FB89D;
    --accent-soft:#25382F;
    --accent-ink:#0F1F18;
    --amber:#D9A44E;
    --amber-soft:#3A3020;
    --amber-ink:#F0DDB8;
    --bad:#C88585;
    --shadow:0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:430px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    animation:screenIn .32s ease both;
  }
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none}
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
    .breath-circle{transition:none !important}
  }

  .topbar{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:6px}
  .back{
    background:none;border:none;color:var(--ink-soft);font-family:var(--body);
    font-size:16px;padding:10px 10px 10px 0;cursor:pointer;border-radius:10px;
  }
  .back:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:3px solid var(--accent);outline-offset:2px;
  }
  .step-dots{display:flex;gap:6px;margin-left:auto}
  .step-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .step-dots i.on{background:var(--accent)}

  .eyebrow{
    font-family:var(--display);font-size:13px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
    margin-bottom:10px;
  }
  h1{
    font-family:var(--display);font-weight:800;font-size:30px;line-height:1.18;
    text-wrap:balance;letter-spacing:-.01em;margin-bottom:10px;
  }
  h2{
    font-family:var(--display);font-weight:800;font-size:24px;line-height:1.22;
    text-wrap:balance;margin-bottom:8px;
  }
  .sub{color:var(--ink-soft);margin-bottom:20px;max-width:34ch}
  .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:12px}

  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
  .chip{
    font-family:var(--body);font-size:16px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);
    border-radius:999px;padding:12px 18px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;
    text-align:left;
  }
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .chip.on::before{content:"✓ ";color:var(--accent);font-weight:700}

  .btn{
    font-family:var(--display);font-weight:800;font-size:18px;
    border:none;border-radius:20px;padding:18px 20px;cursor:pointer;
    width:100%;transition:transform .1s,opacity .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-amber{background:var(--amber);color:#FFF8EC}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .btn-quiet{background:none;color:var(--ink-soft);font-weight:600;font-size:16px;padding:12px}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn-list{text-align:left;font-weight:700;font-size:17px}
  .btn-list small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:2px}
  .btn-primary.btn-list small,.btn-primary small{color:var(--accent-ink);opacity:.8}

  .bigbtn{
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:28px;cursor:pointer;width:100%;
    padding:34px 24px;box-shadow:var(--shadow);
    font-family:var(--display);font-weight:800;font-size:24px;
    letter-spacing:.06em;line-height:1.3;
    transition:transform .12s;
  }
  .bigbtn:active{transform:scale(.98)}
  .bigbtn small{
    display:block;font-size:14px;font-weight:600;letter-spacing:.02em;
    opacity:.85;margin-top:8px;text-transform:none;
  }

  .card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
    padding:20px;box-shadow:var(--shadow);
  }
  .note{
    background:var(--surface2);border-radius:16px;padding:14px 16px;
    color:var(--ink-soft);font-size:15px;
  }
  .note strong{color:var(--ink)}
  .note a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .warn{
    background:var(--amber-soft);color:var(--amber-ink);border-radius:14px;
    padding:12px 14px;font-size:15px;margin-bottom:12px;animation:cardIn .25s ease both;
  }

  input[type=text],textarea{
    width:100%;font-family:var(--body);font-size:17px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
    padding:14px 16px;
  }
  textarea{resize:none;min-height:88px}
  input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.8}

  /* intensity slider */
  .intensity-num{
    font-family:var(--display);font-weight:800;font-size:76px;line-height:1;
    text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;
    margin:18px 0 6px;
  }
  .intensity-label{text-align:center;color:var(--ink-soft);margin-bottom:26px;min-height:24px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;
    background:linear-gradient(to right,var(--accent-soft),var(--accent));
    outline-offset:6px;margin-bottom:6px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:44px;height:44px;border-radius:50%;
    background:var(--surface);border:4px solid var(--accent);box-shadow:var(--shadow);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:40px;height:40px;border-radius:50%;
    background:var(--surface);border:4px solid var(--accent);box-shadow:var(--shadow);cursor:pointer;
  }
  .range-ends{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:14px;margin-bottom:8px}

  /* breathing */
  .breath-wrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    min-height:340px;
  }
  .breath-circle{
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,var(--accent-soft),var(--accent));
    box-shadow:0 0 0 18px var(--accent-soft),var(--shadow);
    transform:scale(.72);
  }
  .breath-circle.mini{width:96px;height:96px;box-shadow:0 0 0 12px var(--accent-soft)}
  .mini-wrap{text-align:center;margin:16px 0 4px;display:flex;flex-direction:column;align-items:center}
  .breath-phase{
    font-family:var(--display);font-weight:800;font-size:22px;margin-top:44px;
    min-height:30px;text-align:center;
  }
  .breath-phase.mini{font-size:17px;margin-top:20px;min-height:24px}
  .breath-count{color:var(--ink-soft);font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums}

  /* control sort */
  .sort-card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:22px;
    padding:34px 22px;box-shadow:var(--shadow);text-align:center;
    font-family:var(--display);font-weight:800;font-size:22px;line-height:1.3;
    min-height:150px;display:flex;align-items:center;justify-content:center;
    animation:cardIn .28s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .sort-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .sort-btns .btn{font-size:16px;padding:16px 10px}
  .col-lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .col{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;min-width:0}
  .col h3{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .col.mine h3{color:var(--accent)}
  .col.not h3{color:var(--ink-soft)}
  .col ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .col li{font-size:15px;line-height:1.35;padding:8px 10px;border-radius:10px;background:var(--surface2)}
  .col.not li{color:var(--ink-soft)}

  /* final action screen */
  .action-final{
    flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;
  }
  .action-word{
    font-family:var(--display);font-weight:800;font-size:34px;line-height:1.2;
    text-wrap:balance;color:var(--ink);
  }
  .action-tag{
    align-self:center;background:var(--amber-soft);color:var(--amber-ink);
    font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;border-radius:999px;padding:8px 16px;
  }

  /* home */
  .home-head{margin:26px 0 8px}
  .brand{
    font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;
  }
  .brand::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;
    background:var(--accent);margin-right:9px}
  .home-greet{color:var(--ink-soft);font-size:15px;margin-top:4px}
  .home-links{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}
  .home-links button{
    background:none;border:none;color:var(--ink-soft);font-family:var(--body);
    font-size:14px;padding:10px 8px;cursor:pointer;text-decoration:underline;
    text-decoration-color:var(--line);text-underline-offset:4px;border-radius:8px;
  }

  /* history */
  .sess-row{display:flex;align-items:baseline;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .sess-row:last-child{border-bottom:none}
  .sess-when{color:var(--ink-soft);font-size:13px;white-space:nowrap}
  .sess-what{flex:1;font-size:15px;min-width:0}
  .sess-what small{display:block;color:var(--ink-soft)}
  .sess-delta{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sess-delta.down{color:var(--accent)}
  .sess-delta.up{color:var(--bad)}
  .stepmark{font-family:var(--display);font-weight:800;white-space:nowrap;font-size:15px}
  .stepmark.yes{color:var(--accent)}
  .stepmark.partly{color:var(--amber)}
  .stepmark.no{color:var(--ink-soft)}

  .footer-note{color:var(--ink-soft);font-size:13px;text-align:center;margin-top:18px}
  .spacer{height:12px}
  .divider{border:none;border-top:1px solid var(--line);margin:18px 0}
</style>

<div id="app"></div>

<script>
"use strict";
/* ============ storage ============ */
const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try{ localStorage.removeItem(k); } catch(e){} }
};
let profile  = store.get('anchor.profile2', null);
let sessions = store.get('anchor.sessions2', []);
let scores   = store.get('anchor.pathScores', {});
let meta     = store.get('anchor.meta', {});
let pending  = store.get('anchor.pending', null);

/* ============ situations (the aunt's categories & content pools — v3 spec) ============ */
/* picker order; 'dating' expands to date|relationship via one sub-tap */
const PICKER = ['social','test','performance','dating','interview','flight','alone','health','conflict','other','unsure'];
const GENERIC = {
  fears:['Something bad will happen','I won’t be able to handle it','I’ll lose control','I don’t even know — it just feels bad'],
  mine:['What I do next','My next small step','Where I put my attention right now','Asking for help if I need it'],
  not:['The future','Other people’s reactions','What already happened','Every feeling in my body'],
  steps:['Take one slow breath and stand up','Drink some water, slowly','Step outside for two minutes','Do the next small thing in front of you'],
  want:'Do the thing anyway'
};
const SIT = {
  social: {
    label:'Social situation', hint:'party, hangout, new people, school, group chat…',
    fears:['I won’t know what to say','I’ll be awkward','They’ll judge me','I’ll be left out','They’ll notice I’m anxious','I’ll say something stupid'],
    mine:['Showing up','Saying hello','Asking a question','Staying instead of immediately leaving','What I do next'],
    not:['What they think of me','Whether everyone likes me','What somebody says','Awkward moments','Their reaction'],
    steps:['Walk in','Say hello to one person','Ask one question','Stay another five minutes'],
    want:'Go — and actually be there'
  },
  test: {
    label:'Test / school', hint:'exam, quiz, school pressure…',
    fears:['I’ll fail','My mind will go blank','I won’t finish in time','I won’t remember what I studied','I’ll panic during the test'],
    mine:['Starting','Reading one question at a time','Moving on if I’m stuck','Returning my attention to the test'],
    not:['The exact questions','How hard it is','Other people’s performance','The final grade right now','Feeling completely calm'],
    steps:['Read the first question','Start with what I know','Work on the next question'],
    want:'Take the test'
  },
  performance: {
    label:'Presentation / performance', hint:'public speaking, audition, sports, stage…',
    fears:['I’ll freeze','I’ll forget what I wanted to say','They’ll notice I’m nervous','I’ll make a mistake','I’ll embarrass myself'],
    mine:['Showing up','Starting','Focusing on what I’m doing','Continuing after a mistake'],
    not:['The audience’s reaction','Whether someone notices I’m nervous','Perfection','Feeling completely calm'],
    steps:['Take my position','Say my first line','Start the first minute'],
    want:'Get up and do it'
  },
  date: {
    label:'Date / meeting someone', hint:'',
    fears:['They won’t like me','There’ll be an awkward silence','I won’t know what to say','I’ll be rejected'],
    mine:['Showing up','Saying hello','Asking a genuine question','Listening','Staying despite some awkwardness'],
    not:['Whether they like me','The chemistry','Their opinion','Awkward silence','Whether there’s another date'],
    steps:['Walk in','Say hello','Ask one genuine question','Stay for the first ten minutes'],
    want:'Show up for the date'
  },
  relationship: {
    label:'Relationship / breakup', hint:'',
    fears:['I sent a message and they haven’t answered','I think I said something wrong','I’ll be rejected'],
    mine:['Whether I send a message','How I respond','What I do next','Who I talk to','How I take care of myself'],
    not:['Whether they reply','What they think','Whether they miss me','Their decision','How the relationship turns out'],
    steps:['Put the phone down for five minutes','Write the message without sending it yet','Do one normal thing I need to do'],
    want:'Say what I mean — once'
  },
  interview: {
    label:'Work / interview', hint:'interview, application, work stress…',
    fears:['I won’t know what to say','I’ll look nervous','I’ll give a bad answer','They won’t like me','I won’t get the job'],
    mine:['Showing up','Listening','Taking a moment before answering','Answering as clearly as I can','Asking a question'],
    not:['The other candidates','The interviewer’s final opinion','Whether I get the job'],
    steps:['Enter the room or the call','Say hello','Answer the first question'],
    want:'Do the interview'
  },
  flight: {
    label:'Flying / travel', hint:'flying, airports, being far from home…',
    fears:['Something will happen to the plane','Turbulence will scare me','I’ll panic and won’t be able to leave','I’ll lose control','I won’t be able to handle how I feel'],
    mine:['Going to the gate','Boarding','Staying in my seat','Following the crew’s instructions','Where I place my attention'],
    not:['Turbulence','The weather','The plane’s sounds','Exactly how the flight feels'],
    steps:['Walk to the gate','Board the plane','Sit down and buckle up','Focus on the next few minutes'],
    want:'Take the flight',
    evenIf:'I can’t control everything that happens. I can handle the next moment.'
  },
  alone: {
    label:'Being alone', hint:'evening alone, empty house, on my own…',
    fears:[],
    mine:['Staying where I am','Doing a normal activity','Choosing what I do next','Checking a real concern once — not repeatedly'],
    not:['Every sound','Every anxious thought','How quickly the anxiety fades','Being 100% certain nothing could happen'],
    steps:['Stay another five minutes','Continue one normal activity','Move on without checking again'],
    want:'Stay — and be okay on my own'
  },
  health: {
    label:'Health / medical', hint:'symptoms, appointments, waiting for results…',
    fears:[],
    mine:GENERIC.mine, not:GENERIC.not, steps:GENERIC.steps,
    want:'Deal with it one step at a time'
  },
  conflict: {
    label:'Difficult conversation', hint:'conflict, confrontation, saying a hard thing…',
    fears:['They’ll get angry','I’ll upset them','I won’t know what to say','They’ll reject me','The conversation will go badly'],
    mine:['What I say','How I say it','Listening','Being clear','Setting an appropriate boundary'],
    not:['Their reaction','Whether they agree','What they feel','What they say'],
    steps:['Start the conversation','Say the first sentence','State clearly what I need to say'],
    want:'Have the conversation'
  },
  other: Object.assign({ label:'Something else', hint:'tell me in a few words' }, GENERIC),
  unsure: Object.assign({ label:'I’m not sure — it came out of nowhere', hint:'no clear reason. It’s just here' }, GENERIC)
};
const EVEN_IF_DEFAULT = 'Even if something I don’t want happens — I can handle what comes next.';

/* map free text ("Something else") to the closest situation */
const TEXT_MAP = [
  ['health',       /\b(doctor|hospital|medical|symptom\w*|sick|illness|diagnos\w*|clinic|surgery|scan|biopsy)\b/i],
  ['test',         /\b(test|exam|quiz|midterm|finals?|grade|study|studying)\b/i],
  ['interview',    /\b(interview|job|hiring|application|applied?)\b/i],
  ['performance',  /\b(present|presentation|speech|perform|performance|stage|audition|recital|tryout|game|match)\b/i],
  ['flight',       /\b(fly|flying|flight|plane|airplane|airport|turbulence|travel|trip)\b/i],
  ['relationship', /\b(breakup|broke up|ex\b|ghost(ed|ing)?|repl(y|ied|ies)|left on read|text(ed)? back|answer(ed|ing)?|respond(ed)?|message[ds]?)\b/i],
  ['date',         /\b(date|dating|crush|boyfriend|girlfriend|partner)\b/i],
  ['conflict',     /\b(fight|fighting|argu\w*|confront\w*|conflict|angry|mad at|yell\w*|boss)\b/i],
  ['alone',        /\b(alone|by myself|lonely|empty house|home alone|on my own)\b/i],
  ['social',       /\b(part(y|ies)|friends?|people|social|school|class|group|hang(ing)?( ?out)?|meet(ing)? new)\b/i]
];
function mapText(t){
  for(const [k, re] of TEXT_MAP){ if(re.test(t)) return k; }
  return 'other';
}

/* safety — free-text content that self-help must not handle */
const SAFETY_RE = /(kill (myself|me)|suicid\w*|self.?harm|hurt(ing)? myself|cut(ting)? myself|end my life|end it all|don'?t want to (live|be alive|exist)|better off dead|want to die|wanna die|no reason to live|overdose)/i;
function safetyCheck(text){
  if(text && SAFETY_RE.test(text)){ go('safety'); return true; }
  return false;
}

/* ============ decision tree ============ */
const PATHS = {
  fear:    ['fear','control','action'],
  loop:    ['loop','control','action'],
  control: ['control','action'],
  avoid:   ['avoid','action'],
  body:    ['body','control','action']
};
const PATH_LABEL = {
  fear:'Looking at the fear straight', loop:'Spotting the loop',
  control:'Sorting what’s in your control', avoid:'Finding one step forward',
  body:'Starting with your body', fast:'Body first, then one step'
};
const TOOL_EYEBROW = {
  body:'Body first', fear:'Look at it straight', loop:'Spot the loop',
  control:'In my control — or not', avoid:'One step forward', action:'One small step'
};

function composePath(key, intensity){
  let seq = PATHS[key].slice();
  if(intensity >= 8 && !seq.includes('body')){
    const firstMid = seq.find(t => t !== 'action');
    seq = ['body'].concat(firstMid ? [firstMid] : []).concat(['action']);
  }
  return seq;
}
function bestPathFor(sit){
  const s = scores[sit];
  if(!s) return null;
  let best = null;
  Object.keys(s).forEach(t => { if(s[t] >= 2 && (!best || s[t] > s[best])) best = t; });
  return best;
}
function applyPts(sit, seq, pts){
  if(!pts) return;
  if(!scores[sit]) scores[sit] = {};
  seq.forEach(t => {
    if(t === 'action') return;
    scores[sit][t] = Math.max(-6, Math.min(6, (scores[sit][t] || 0) + pts));
  });
  store.set('anchor.pathScores', scores);
}

/* ============ onboarding (her exact 5 questions) ============ */
const OB_SIT_OPTS = [

  ['alone','Being alone'],['health','Health / medical situations'],['othersit','Other']

const OB_STEPS = [
  {key:'age', multi:false, title:'How old are you?', sub:'',
   options:['14–17','18–24','25–34','35–49','50+']},
  {key:'situations', multi:true, title:'Where does anxiety tend to show up for you?', sub:'Pick as many as you like.',
   options:OB_SIT_OPTS.map(o => o[1]), keys:OB_SIT_OPTS.map(o => o[0])},
  {key:'response', multi:true, title:'When anxiety rises, what tends to take over?', sub:'',
   options:['My body — heart racing, tightness, shaking…','My thoughts — what ifs, overthinking, replaying…','The urge to escape — avoiding, leaving, cancelling…','It depends']},
  {key:'reaction', multi:true, title:'What do you tend to do when anxiety gets strong?', sub:'Whatever’s true. No judging.',
   options:['Avoid or leave','Overthink it','Check / ask for reassurance','Distract myself','Do it anyway','I’m not sure']},
  {key:'goal', multi:true, title:'What do you want anxiety to stop getting in the way of?', sub:'',

/* ============ state ============ */
function dueFollowup(){ return pending && (Date.now() - pending.at > 20 * 60 * 1000); }
let S = {
  screen: meta.onboarded2 ? (dueFollowup() ? 'followup' : 'home') : 'welcome',
  ob: null, sess: null, tool: null,
  pendingSit: null, pendingNote: null, pendingIntensity: 6,
  decide: null, lastStep: null,
  breathTimers: []
};

function startOb(){
  const d = { age:'', situations:[], response:[], reaction:[], goal:[] };
  if(profile){ Object.keys(d).forEach(k => { if(profile[k]) d[k] = Array.isArray(profile[k]) ? profile[k].slice() : profile[k]; }); }
  S.ob = { step:0, data:d };
  go('ob');
}
function startSession(pathKey){
  S.sess = {
    situation: S.pendingSit, note: S.pendingNote || null,
    intensity: S.pendingIntensity, identify: pathKey,
    seq: composePath(pathKey, S.pendingIntensity),
    i: 0, action: null, after: null, controlMine: []
  };
  openTool(S.sess.seq[0]);
}
function openTool(tool){
  S.tool = { name: tool, step: 0, data: {} };
  go('tool');
}
function nextTool(){
  const s = S.sess;
  s.i++;
  if(s.i < s.seq.length) openTool(s.seq[s.i]);
  else go('debrief');
}
function finishRecord(){
  const s = S.sess;
  const at = Date.now();
  const rec = {
    at, situation: s.situation, note: s.note, identify: s.identify,
    fear: s.fear || null,
    path: s.seq.slice(), before: s.intensity,
    after: (typeof s.after === 'number') ? s.after : null,
    action: s.action || null, stepDone: null, howWent: null
  };
  sessions.unshift(rec);
  if(sessions.length > 100) sessions = sessions.slice(0, 100);
  store.set('anchor.sessions2', sessions);
  if(rec.after != null) applyPts(s.situation, s.seq, Math.max(-2, Math.min(2, s.intensity - rec.after)));
  if(rec.action){
    pending = { at, recAt: at, situation: s.situation, action: rec.action, path: s.seq.slice() };
    store.set('anchor.pending', pending);
  }
  return rec;
}

/* ============ render helpers ============ */
function esc(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function chips(options, selected, act){
  return '<div class="chips">' + options.map((o,i) =>
    '<button class="chip' + (selected.includes(o) ? ' on' : '') + '" data-act="' + act + '" data-val="' + i + '">' + esc(o) + '</button>'
  ).join('') + '</div>';
}
function dots(n, on){
  let h = '<div class="step-dots">';
  for(let i = 0; i < n; i++) h += '<i class="' + (i <= on ? 'on' : '') + '"></i>';
  return h + '</div>';
}
function topbar(backAct, dotsHtml){
  return '<div class="topbar">' +
    (backAct ? '<button class="back" data-act="' + backAct + '">← Back</button>' : '') +
    (dotsHtml || '') + '</div>';
}
function sliderBlock(id, val){
  return '<div class="intensity-num" id="' + id + '-num">' + val + '</div>' +
    '<div class="intensity-label" id="' + id + '-label">' + intensityWord(val) + '</div>' +
    '<div class="range-ends"><span>calm</span><span>overwhelming</span></div>' +
    '<input type="range" id="' + id + '" min="0" max="10" step="1" value="' + val + '" aria-label="Anxiety level from 0 to 10">';
}
function intensityWord(v){
  if(v <= 2) return 'barely there';
  if(v <= 4) return 'noticeable';
  if(v <= 6) return 'strong';
  if(v <= 8) return 'really strong';
  return 'overwhelming';
}
function bindSlider(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', () => {
    document.getElementById(id + '-num').textContent = el.value;
    document.getElementById(id + '-label').textContent = intensityWord(+el.value);
  });
}
function readInput(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function pack(){ return SIT[S.sess ? S.sess.situation : (S.pendingSit || 'other')] || SIT.other; }
function sample(arr, n){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}
/* a smaller version of a step — only reductions the spec authorizes, else null (user writes their own) */
function smallerStep(action, sit){
  if(/^walk in/i.test(action)) return 'Walk to the entrance';
  if(/^stay\b.*\b(minutes?|activity)/i.test(action)) return 'Stay 2 more minutes';
  if(/^board the plane$/i.test(action)) return 'Walk to the gate';
  const steps = (SIT[sit] || SIT.other).steps;
  const i = steps.indexOf(action);
  if(i > 0) return steps[i - 1];
  return null;
}

function clearBreath(){ S.breathTimers.forEach(clearTimeout); S.breathTimers = []; }
function runBreathing(){
  clearBreath();
  const circle = document.getElementById('bcircle');
  const phase = document.getElementById('bphase');
  const count = document.getElementById('bcount');
  if(!circle) return;
  const CYCLES = 5, IN = 4000, OUT = 6000;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 900;
  S.breathTimers.push(setTimeout(() => { phase.textContent = 'Ready…'; }, 0));
  for(let c = 0; c < CYCLES; c++){
    S.breathTimers.push(setTimeout(() => {
      phase.textContent = 'Breathe in through your nose';
      count.textContent = 'round ' + (c + 1) + ' of ' + CYCLES;
      if(!reduced){ circle.style.transition = 'transform ' + IN + 'ms cubic-bezier(.4,0,.4,1)'; circle.style.transform = 'scale(1.18)'; }
      else { circle.style.opacity = '1'; }
    }, t));
    t += IN;
    S.breathTimers.push(setTimeout(() => {
      phase.textContent = 'Slowly out through your mouth';
      if(!reduced){ circle.style.transition = 'transform ' + OUT + 'ms cubic-bezier(.45,0,.55,1)'; circle.style.transform = 'scale(.72)'; }
      else { circle.style.opacity = '.55'; }
    }, t));
    t += OUT;
  }
  S.breathTimers.push(setTimeout(() => {
    phase.textContent = 'Well done.';
    count.textContent = '';
    const done = document.getElementById('bdone'), skip = document.getElementById('bskip');
    if(done) done.hidden = false;
    if(skip) skip.hidden = true;
  }, t + 200));
}

      '<button class="btn btn-ghost" data-act="loopA" data-val="few">A few times</button>' +
      '<button class="btn btn-ghost" data-act="loopA" data-val="first">This is the first time</button>' +
      '</div><div class="grow"></div>';
  }
  if(st === 1){
    return head + '<h2>Since the last time — has any <em>new</em> information shown up?</h2>' +
      '<div class="grow"></div><div class="stack">' +
      '<button class="btn btn-ghost" data-act="loopB" data-val="no">No — same thought, another lap</button>' +
      '<button class="btn btn-ghost" data-act="loopB" data-val="yes">Yes, something actually new</button>' +
      '</div><div class="grow"></div>';
  }
  if(st === 2){
    return head + '<div class="grow"></div>' +
      '<div class="card" style="text-align:center">' +
        '<h2>This is the anxiety loop — not a new problem to solve.</h2>' +
        '<p class="sub" style="margin:10px auto 0">You don’t have to push the thought out of your head. A thought can be there without deciding what you do next. Just notice it: <em>that’s the loop again.</em> You’ve already done this lap.</p>' +
      '</div>' +
      '<div class="grow"></div>' +
      (S.sess.seq.length === 1
        ? '<div class="stack">' +
          '<button class="btn btn-primary" data-act="loopBridge" data-val="action">One small action instead</button>' +
          '<button class="btn btn-ghost" data-act="loopBridge" data-val="control">Sort what’s in my control</button>' +
          '<button class="btn btn-quiet" data-act="loopOkay">I’m okay now</button></div>'
        : '<button class="btn btn-primary" data-act="toolDone">Continue</button>');
  }
  return head + '<div class="grow"></div>' +
    '<div class="card" style="text-align:center">' +
      '<h2>Then it deserves one honest look — not a loop.</h2>' +
      '<p class="sub" style="margin:10px auto 0">Let’s look at it once, properly, and then decide what’s yours to do.</p>' +
    '</div>' +
    '<div class="grow"></div>' +
    '<button class="btn btn-primary" data-act="loopToFear">Look at it once</button>';
};

/* CONTROL — with gentle correction of wrong sorts */
TOOL_VIEWS.control = () => {
  const d = S.tool.data, p = pack();
  const head = toolHeader();
  if(!d.cards){
    /* 3 + 3, sampled from the pools so the exercise varies between uses */
    const a = sample(p.mine, 3).map(t => ({t, truth:'mine'}));
    const b = sample(p.not, 3).map(t => ({t, truth:'not'}));
    const cards = [];
    for(let i = 0; i < Math.max(a.length, b.length); i++){
      if(a[i]) cards.push(a[i]);
      if(b[i]) cards.push(b[i]);
    }
    d.cards = cards; d.idx = 0; d.mine = []; d.not = []; d.tries = 0; d.warn = null;
  }
  if(d.idx < d.cards.length){
    return head + '<p class="sub" style="margin-bottom:6px">Sort each one. Card ' + (d.idx + 1) + ' of ' + d.cards.length + '.</p>' +
      '<div class="grow"></div>' +
      (d.warn ? '<div class="warn">' + esc(d.warn) + '</div>' : '') +
      '<div class="sort-card">' + esc(d.cards[d.idx].t) + '</div>' +
      '<div class="sort-btns">' +
        '<button class="btn btn-primary" data-act="sortCard" data-val="mine">In my control</button>' +
        '<button class="btn btn-ghost" data-act="sortCard" data-val="not">Not in my control</button>' +
      '</div>' +
      '<div class="grow"></div>' +
      '<button class="btn btn-quiet" data-act="sortSkip">skip this one</button>';
  }
  return head + '<h2>Here’s the split.</h2>' +
    '<p class="sub">Your energy goes to the left column. The right one isn’t yours to solve — if something happens there, you’ll deal with it then.</p>' +
    '<div class="col-lists">' +
      '<div class="col mine"><h3>In my control</h3><ul>' +
        (d.mine.length ? d.mine.map(x => '<li>' + esc(x) + '</li>').join('') : '<li>—</li>') + '</ul></div>' +
      '<div class="col not"><h3>Not in my control</h3><ul>' +
        (d.not.length ? d.not.map(x => '<li>' + esc(x) + '</li>').join('') : '<li>—</li>') + '</ul></div>' +
    '</div>' +
    '<div class="grow"></div><div class="spacer"></div>' +
    '<button class="btn btn-primary" data-act="toolDone">Continue</button>';
};

function concreteFor(half){
  if(/reach|text|messag|call|send|talk|tell/i.test(half)) return 'Send one honest message.';
  if(/rest|leave|wait|let it|sit|drop|nothing|space/i.test(half)) return 'Leave it for now and go back to what you were doing.';
  const t = half.trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

SCREENS.history = () => {
  const n = sessions.length;
  const stepsYes = sessions.filter(s => s.stepDone === 'yes').length;
  let rows = sessions.slice(0, 20).map(s => {
    const dte = new Date(s.at);
    const when = (dte.getMonth() + 1) + '/' + dte.getDate();
    const delta = (s.after != null) ? s.before - s.after : null;
    const dHtml = delta == null ? '' :
      '<span class="sess-delta ' + (delta > 0 ? 'down' : (delta < 0 ? 'up' : '')) + '">' +
      s.before + ' → ' + s.after + '</span>';
    const mark = s.stepDone === 'yes' ? '<span class="stepmark yes">step ✓</span>' :
      s.stepDone === 'partly' ? '<span class="stepmark partly">step ±</span>' :
      (s.stepDone === 'no' || s.stepDone === 'not_yet') ? '<span class="stepmark no">step —</span>' : '';
    return '<div class="sess-row"><span class="sess-when">' + when + '</span>' +
      '<span class="sess-what">' + esc(SIT[s.situation] ? SIT[s.situation].label : s.situation) +
      '<small>' + (s.action ? esc(s.action) : PATH_LABEL[s.identify] || '') + '</small></span>' +
      mark + dHtml + '</div>';
  }).join('');
  return topbar('goHome') +
    '<h2>My path</h2>' +
    '<p class="sub" style="max-width:none">' + insightLine() + '</p>' +
    (stepsYes > 0 ? '<div class="note" style="margin-bottom:14px"><strong>' + stepsYes +
      (stepsYes === 1 ? ' time' : ' times') + '</strong> you did the thing anxiety was trying to stop. That’s the number that matters.</div>' : '') +
    (n ? '<div class="card" style="padding:6px 16px">' + rows + '</div>'
      : '<div class="note">Nothing here yet. Next time anxiety rises, open Anchor — each time teaches it what helps <em>you</em>.</div>') +
    '<div class="grow"></div>';
};
function insightLine(){
  let best = null;
  Object.keys(scores).forEach(sit => {
    Object.keys(scores[sit]).forEach(t => {
      const v = scores[sit][t];
      if(v > 0 && (!best || v > best.v)) best = {sit, t, v};
    });
  });
  if(best) return PATH_LABEL[best.t] + ' has helped you move forward most, around ' +
    (SIT[best.sit] ? SIT[best.sit].label.toLowerCase() : best.sit) + '. I’ll lean on it there.';
  if(sessions.length) return 'A few more times and I’ll know which path works best for you, where.';
  return 'Your path will show up here.';
}

/* ============ router + actions ============ */
const app = document.getElementById('app');

function go(screen){
  clearBreath();
  S.screen = screen;
  app.innerHTML = '<div class="screen">' + SCREENS[screen]() + '</div>';
  if(screen === 'intensity') bindSlider('intensity');
  if(screen === 'debrief') bindSlider('after');
  if(screen === 'tool' && S.tool.name === 'body') runBreathing();
  window.scrollTo(0,0);
}
function rerenderTool(){ go('tool'); }

const ACTS = {
  /* nav */
  goHome(){ go(dueFollowup() ? 'followup' : 'home'); },
  goProfile(){ go('profile'); },
  goHistory(){ go('history'); },
  goAbout(){ go('about'); },
  startOb(){ startOb(); },
  skipOb(){ meta.onboarded2 = true; store.set('anchor.meta', meta); go('home'); },
  exitSession(){ go('home'); },
  rising(){ go('situation'); },
  backIntensity(){ go('intensity'); },
  toRecognizeBack(){ go('recognize'); },
  toIdentifyBack(){ go('identify'); },

  /* onboarding */
  obChip(val, el){
    const st = OB_STEPS[S.ob.step];
    const stored = st.keys ? st.keys[+val] : st.options[+val];
    if(!st.multi){
      S.ob.data[st.key] = stored;
      document.querySelectorAll('[data-act=obChip]').forEach(c => c.classList.remove('on'));
      el.classList.add('on');
      return;
    }
    const arr = S.ob.data[st.key];
    const i = arr.indexOf(stored);
    if(i >= 0) arr.splice(i,1); else arr.push(stored);
    el.classList.toggle('on');
  },
  obBack(){ S.ob.step--; go('ob'); },
  obNext(){
    if(S.ob.step < OB_STEPS.length - 1){ S.ob.step++; go('ob'); }
    else {
      profile = S.ob.data;
      store.set('anchor.profile2', profile);
      meta.onboarded2 = true; store.set('anchor.meta', meta);
      go('startpoint');
    }
  },

  /* follow-up */
  stepAnswer(val){
    const rec = sessions.find(r => r.at === (pending.recAt || pending.at));
    if(val === 'yes'){
      if(rec){ rec.stepDone = 'yes'; store.set('anchor.sessions2', sessions); }
      applyPts(pending.situation, pending.path, 3);
      go('followupHow');
      return;
    }
    /* not yet — no penalty; offer a smaller step */
    if(rec && !rec.stepDone){ rec.stepDone = 'not_yet'; store.set('anchor.sessions2', sessions); }
    go('smaller');
  },
  howWent(val){
    const rec = sessions.find(r => r.at === (pending.recAt || pending.at));
    if(rec){ rec.howWent = val; store.set('anchor.sessions2', sessions); }
    pending = null; store.del('anchor.pending');
    S.lastStep = 'yes';
    go('home');
  },
  smallerPick(val){
    let a = null;
    if(val === 'sug') a = smallerStep(pending.action, pending.situation);
    else a = readInput('smaller-input');
    if(!a) return;
    if(safetyCheck(a)) return;
    pending = { at: Date.now(), recAt: pending.recAt || pending.at,
      situation: pending.situation, action: a, path: pending.path };
    store.set('anchor.pending', pending);
    S.lastStep = 'smaller'; S.lastAction = a;
    go('followupDone');
  },
  smallerKeep(){
    pending.at = Date.now();
    store.set('anchor.pending', pending);
    S.lastStep = 'keep';
    go('followupDone');
  },
  smallerDrop(){
    pending = null; store.del('anchor.pending');
    S.lastStep = 'drop';
    go('followupDone');
  },

  /* check-in */
  pickSituation(val){
    if(val === 'other'){ go('freeText'); return; }
    if(val === 'dating'){ go('dateSub'); return; }
    S.pendingSit = val; S.pendingNote = null;
    go('intensity');
  },
  freeNext(){
    const t = readInput('free-input');
    if(safetyCheck(t)) return;
    S.pendingSit = t ? mapText(t) : 'other';
    S.pendingNote = t || null;
    go('intensity');
  },
  toRecognize(){
    S.pendingIntensity = +((document.getElementById('intensity') || {}).value || 6);
    go('recognize');
  },
  oneBreath(){
    clearBreath();
    const c = document.getElementById('mcircle'), p = document.getElementById('mphase');
    const b = document.getElementById('onebreath-btn');
    if(!c) return;
    if(b) b.disabled = true;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    S.breathTimers.push(setTimeout(() => {
      p.textContent = 'In through your nose…';
      if(!reduced){ c.style.transition = 'transform 4000ms cubic-bezier(.4,0,.4,1)'; c.style.transform = 'scale(1.2)'; }
    }, 100));
    S.breathTimers.push(setTimeout(() => {
      p.textContent = 'Slowly out through your mouth…';
      if(!reduced){ c.style.transition = 'transform 6000ms cubic-bezier(.45,0,.55,1)'; c.style.transform = 'scale(1)'; }
    }, 4100));
    S.breathTimers.push(setTimeout(() => {
      p.textContent = 'Good.';
      if(b) b.disabled = false;
    }, 10300));
  },
  toIdentify(){ go('identify'); },
  pickIdentify(val){
    if(val === 'unsure'){ go('clarify'); return; }
    startSession(val);
  },
  pickClarify(val){ startSession(val); },

  /* home shortcuts */
  justHelp(){
    S.pendingSit = sessions.length ? sessions[0].situation : 'other';
    S.pendingNote = null; S.pendingIntensity = 9;
    S.sess = {
      situation: S.pendingSit, note: null, intensity: 9, identify: 'fast',
      seq: ['body','action'], i: 0, action: null, after: null, controlMine: []
    };
    openTool('body');
  },
  inLoop(){
    S.pendingSit = sessions.length ? sessions[0].situation : 'other';
    S.sess = {
      situation: S.pendingSit, note: null, intensity: 6, identify: 'loop',
      seq: ['loop'], i: 0, action: null, after: null, controlMine: []
    };
    openTool('loop');
  },

  /* body */
  breatheAgain(){ const d = document.getElementById('bdone'); if(d) d.hidden = true; runBreathing(); },
  toolDone(){
    if(S.tool.name === 'control') S.sess.controlMine = (S.tool.data.mine || []).slice();
    nextTool();
  },

  /* fear */
  fearPick(val, el){
    document.querySelectorAll('[data-act=fearPick]').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    S.tool.data.fear = el.textContent.replace(/^✓ /,'');
  },
  copePick(val, el){
    const d = S.tool.data; d.copes = d.copes || [];
    const t = el.textContent.replace(/^✓ /,'');
    const i = d.copes.indexOf(t);
    if(i >= 0) d.copes.splice(i,1); else d.copes.push(t);
    el.classList.toggle('on');
  },
  fearNext(){
    const d = S.tool.data;
    if(S.tool.step === 0){
      const typed = readInput('fear-input');
      if(safetyCheck(typed)) return;
      if(typed) d.fear = typed;
      if(d.fear) S.sess.fear = d.fear;
    }
    if(S.tool.step === 1){
      const typed = readInput('cope-input');
      if(safetyCheck(typed)) return;
      if(typed){ d.copes = d.copes || []; d.copes.push(typed); }
    }
    S.tool.step++;
    rerenderTool();
  },

  /* loop */
  loopA(val){
    S.tool.step = (val === 'first') ? 3 : 1;
    rerenderTool();
  },
  loopB(val){
    S.tool.step = (val === 'yes') ? 3 : 2;
    rerenderTool();
  },
  loopToFear(){
    const s = S.sess;
    const rest = s.intensity >= 8 ? ['fear','action'] : ['fear','control','action'];
    s.seq = s.seq.slice(0, s.i + 1).concat(rest);
    nextTool();
  },
  loopBridge(val){
    S.sess.seq = ['loop'].concat(val === 'control' ? ['control','action'] : ['action']);
    nextTool();
  },
  loopOkay(){
    S.sess.after = Math.max(0, S.sess.intensity - 2);
    finishRecord();
    go('calm');
  },

  /* control */
  sortCard(val){
    const d = S.tool.data;
    const c = d.cards[d.idx];
    if(c.truth && val !== c.truth && d.tries === 0){
      d.tries = 1;
      d.warn = c.truth === 'not'
        ? 'Take another look. You can control what you do — not what someone else thinks or does.'
        : 'Look again — this one actually is yours. It’s something you can do.';
      rerenderTool();
      return;
    }
    const col = (c.truth && val !== c.truth) ? c.truth : val;
    d[col].push(c.t);
    d.idx++; d.tries = 0; d.warn = null;
    rerenderTool();
  },
  sortSkip(){
    const d = S.tool.data;
    d.idx++; d.tries = 0; d.warn = null;
    rerenderTool();
  },

  /* avoid */
  wantPick(val, el){
    document.querySelectorAll('[data-act=wantPick]').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    S.tool.data.want = el.textContent.replace(/^✓ /,'');
  },
  avoidNext(){
    const typed = readInput('want-input');
    if(safetyCheck(typed)) return;
    if(typed) S.tool.data.want = typed;
    S.tool.step = 1;
    rerenderTool();
  },

  /* action */
  actionPick(val, el){
    document.querySelectorAll('[data-act=actionPick]').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    S.tool.data.action = el.textContent.replace(/^✓ /,'');
  },
  actionChosen(){
    const typed = readInput('action-input');
    if(safetyCheck(typed)) return;
    const a = typed || S.tool.data.action;
    if(!a) return;
    if(/^whether\b/i.test(a) || /\s+or\s+/i.test(a)){
      const halves = a.replace(/^whether\s+/i,'').split(/\s+or\s+/i).map(h => h.trim()).filter(Boolean).slice(0,3);
      if(halves.length >= 2){
        S.decide = { halves };
        go('decide');
        return;
      }
    }
    S.sess.action = a;
    go('debrief');
  },
  decidePick(val){
    S.sess.action = concreteFor(S.decide.halves[+val]);
    S.decide = null;
    go('debrief');
  },

  /* debrief */
  afterDone(){
    S.sess.after = +((document.getElementById('after') || {}).value || S.sess.intensity);
    finishRecord();
    go(S.sess.action ? 'commit' : 'calm');
  },

  /* erase */
  eraseAsk(){ go('erase'); },
  eraseYes(){
    ['anchor.profile2','anchor.sessions2','anchor.pathScores','anchor.pending',
     'anchor.profile','anchor.sessions','anchor.toolScores','anchor.meta'].forEach(store.del);
    profile = null; sessions = []; scores = {}; meta = {}; pending = null;
    S = { screen:'welcome', ob:null, sess:null, tool:null, pendingSit:null, pendingNote:null,
      pendingIntensity:6, decide:null, lastStep:null, breathTimers:[] };
    go('welcome');
  }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACTS[el.dataset.act];
  if(fn) fn(el.dataset.val, el);
});

go(S.screen);
</script>

</html>
